server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        # 1. AUTH SERVICE (public)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # 2. CATALOG SERVICE
        # PUBLIC PRODUCTS (public)
        - id: catalog-products-public
          uri: http://localhost:8085
          predicates:
            - Path=/api/products/public/**
        # ADMIN PRODUCTS (cần login + role ADMIN nếu bạn muốn)
        - id: catalog-products-admin
          uri: http://localhost:8085
          predicates:
            - Path=/api/products/admin/**
          filters:
            - name: Authentication
              args:
                requiredRole: ROLE_ADMIN
        #upload file
        - id: catalog-uploads
          uri: http://localhost:8085
          predicates:
            - Path=/uploads/**

        # 3. USER SERVICE
        # /me cần login
        - id: user-me
          uri: http://localhost:8086
          predicates:
            - Path=/api/users/me
          filters:
            - Authentication

        # các endpoint user khác public (tuỳ bạn)
        - id: user-public
          uri: http://localhost:8086
          predicates:
            - Path=/api/users/**

        # 4. CART SERVICE (cần login + ROLE_USER nếu bạn muốn)
        - id: cart-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/cart/**
          filters:
            - name: Authentication
              args:
                requiredRole: ROLE_USER

        # 5. ORDER SERVICE (cần login + ROLE_USER nếu bạn muốn)
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
          filters:
            - name: Authentication
        # 6. CONTENT SERVICE
        # CONTENT PUBLIC
        - id: content-public
          uri: http://localhost:8087
          predicates:
          - Path=/api/content/public/**

  # CONTENT ADMIN (cần login + role ADMIN)
        - id: content-admin
          uri: http://localhost:8087
          predicates:
          - Path=/api/content/admin/**
          filters:
          - name: Authentication
            args:
              requiredRole: ROLE_ADMIN
        # 7. PAYMENT SERVICE (cần login + ROLE_USER nếu bạn muốn)
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**
          filters:
            - name: Authentication
              args:
                requiredRole: ROLE_USER

jwt:
  secret: "my-super-secret-key-which-is-at-least-32-chars!"

app:

  upload:
    base-dir: "src/main/resources/uploads"

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
