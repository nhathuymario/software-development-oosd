server:
  port: 8087

spring:
  application:
    name: content-service
  datasource:
    url: jdbc:mysql://localhost:3306/content_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
app:
  upload-dir: "uploads/content"
  # hoặc Windows tuyệt đối:
  # upload-dir: "C:/oosd/uploads/content"
eureka:
  client:
    enabled: false # Tắt Eureka cho đỡ lỗi