server:
  port: 8086

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3307/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
jwt:
  secret: "my-super-secret-key-which-is-at-least-32-chars!"

# ... các cấu hình khác (server.port, database...) giữ nguyên

eureka:
  client:
    enabled: false            # <--- Quan trọng: Tắt client đi
    register-with-eureka: false
    fetch-registry: false
